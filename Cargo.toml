[workspace]
resolver = "2"
members = [
    "crates/admin-shell/core",
    "crates/admin-shell/dioxus",
    "crates/ui/components",
    "extensions/crud",
    "examples/web",
]

[workspace.package]
version = "2026.8.13"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
homepage = "https://github.com/zjarlin/dioxus-admin-workbench"
repository = "https://github.com/zjarlin/dioxus-admin-workbench"

[workspace.dependencies]
anyhow = "1.0.99"
az-admin-shell-core = { version = "=2026.8.13", path = "crates/admin-shell/core" }
az-dioxus-admin-extension-crud = { version = "=2026.8.17", path = "extensions/crud" }
az-dioxus-admin-shell = { version = "=2026.8.17", path = "crates/admin-shell/dioxus" }
az-ui-components = { version = "=2026.8.17", path = "crates/ui/components" }
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"] }
dioxus-icons = { version = "0.1.0", default-features = false }
convert_case = "0.8.0"
deunicode = "1.6.2"
futures-util = "0.3.31"
gloo-net = { version = "0.6.0", features = ["http", "json"] }
icons = { version = "0.18.3", features = ["dioxus"] }
manganis = "0.7.9"
rudi = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.23.1", features = ["v4", "serde", "js"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
