name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - run: cargo package -p az-ui-components
      - run: cargo package -p az-admin-shell-core
      - run: cargo package -p az-dioxus-admin-shell
      - run: cargo package -p az-dioxus-admin-extension-crud
