[package]
name = "az-dioxus-admin-shell"
version = "2026.8.17"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless, provider-driven Dioxus admin workbench for scenes, menus, convention pages, and extensions."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dioxus", "admin", "dashboard", "plugin", "workbench"]
categories = ["gui", "wasm", "web-programming"]
workspace = "../../.."

[features]
default = ["workbench"]
workbench = [
    "dep:az-admin-shell-core",
    "dep:futures-util",
    "dep:manganis",
    "dep:rudi",
    "dep:serde_json",
]

[dependencies]
anyhow.workspace = true
az-admin-shell-core = { workspace = true, optional = true }
az-ui-components.workspace = true
dill.workspace = true
dioxus = { workspace = true, features = ["hooks", "document", "asset"] }
futures-util = { workspace = true, optional = true }
icons.workspace = true
manganis = { workspace = true, optional = true }
rudi = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
